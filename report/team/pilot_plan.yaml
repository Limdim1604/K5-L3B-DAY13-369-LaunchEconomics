# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (baseline 70%, mục tiêu 75%, alpha 0,05, power 80%).
#   b) Theo nhân viên, m = 75: ICC 0,02; design effect 2,48; 3.103 yêu cầu mỗi nhóm; 42 nhân viên mỗi nhóm; tổng 84, vượt 40 nhân viên.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng khoảng 604,84; tối đa 1.000; không đủ phát hiện mức tăng 5 điểm phần trăm với power 80%.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 300; không đáp ứng yêu cầu.
#   e) Mức chênh 6 điểm: 859 yêu cầu hiệu dụng mỗi nhóm; 299 yêu cầu mỗi nhân viên; 5.980 yêu cầu thực tế mỗi nhóm; design effect khoảng 6,96; nếu tăng 5 điểm thì power khoảng 64,2%.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có; 20 nhân viên xử lý thủ công và 20 nhân viên dùng trợ lý chạy trong cùng khoảng thời gian.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên bằng code, có seed lưu trước và phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có nguy cơ chia sẻ trong cùng depot; giảm bằng phân quyền tài khoản, hướng dẫn riêng, log sử dụng và phân tích theo phân nhóm ban đầu.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có; chỉ số chính, MDE 5/6 điểm, ngày đánh giá và điều kiện đủ dữ liệu được ghi trước.
#   5. Ít nhất 20 cụm mỗi nhóm: Có; mỗi nhân viên là một cụm, 20 cụm mỗi nhóm.
#
# Đánh đổi đã chấp nhận: thiết kế đạt power 80% cho mức tăng 6 điểm, nhưng power khoảng 64,2% nếu mức tăng thực tế chỉ là 5 điểm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: toàn mẫu 51/1.200 = 4,25%; noi_dia + hang_nang 39/982 = 3,97%.

pilot:
  owner: "Trưởng bộ phận vận hành CSKH LogiX-VN" # một vai trò có quyền quyết định
  scope: "noi_dia và hang_nang; dự kiến 12 depot, nhưng dữ liệu mẫu chỉ có 6 depot nên cần xác minh khả năng phân bổ nhân viên thực tế tại 12 depot" # dựa vào A3
  assignment:
    unit: "staff"                 # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng; cần 5.980 yêu cầu thực tế mỗi nhóm
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên xử lý thủ công và 20 nhân viên dùng trợ lý chạy trong cùng khoảng thời gian."
    spillover_risk: "Có nguy cơ nhân viên cùng depot chia sẻ câu trả lời và kinh nghiệm; giảm bằng phân quyền tài khoản, hướng dẫn riêng, log sử dụng và phân tích theo phân nhóm ban đầu."
    predeclared: "Có: chỉ số chính là tỷ lệ đóng trong 24 giờ và không mở lại trong 7 ngày; MDE kinh doanh 5 điểm, MDE thống kê 6 điểm; ghi trước ngày đánh giá và điều kiện đủ dữ liệu."
  stop_rules:
    - "NẾU tỷ lệ mở lại trong 7 ngày ở nhánh trợ lý vượt 6% hoặc cao hơn đối chứng trên 2 điểm phần trăm TRONG hai cửa sổ 7 ngày liên tiếp, mỗi nhóm/cửa sổ có ít nhất 200 yêu cầu đủ thời gian theo dõi THÌ Trưởng bộ phận vận hành CSKH dừng mở rộng và kiểm tra nguyên nhân KHÔNG THÌ tiếp tục theo dõi."
    - "NẾU chi phí mỗi việc thành công đo được vượt 8.000 đồng TRONG hai cửa sổ 7 ngày liên tiếp, mỗi cửa sổ có ít nhất 200 việc thành công THÌ PM trợ lý hoàn phí phải dừng mở rộng và rà soát chi phí KHÔNG THÌ tiếp tục rollout theo kế hoạch."
    - "NẾU tỷ lệ nhân viên sửa hoặc bỏ gợi ý vượt 40% TRONG một tuần với ít nhất 30 yêu cầu được xem lại THÌ Trưởng nhóm CSKH dừng mở rộng, phỏng vấn năm nhân viên và rà soát trải nghiệm KHÔNG THÌ tiếp tục thu thập dữ liệu sử dụng."
    - "NẾU phát hiện từ một giao dịch hoàn tiền trùng cho cùng yêu cầu trong chu kỳ đối soát 24 giờ TRONG chu kỳ đối soát đó THÌ Trưởng bộ phận vận hành CSKH dừng ngay luồng tự động và chuyển sang xử lý thủ công KHÔNG THÌ tiếp tục luồng đã kiểm soát."
  interim_looks: "Chỉ kiểm tra an toàn, chi phí và sử dụng để thực hiện luật dừng; không kiểm định liên tục chỉ số chính để kết luận hiệu quả sớm."
  rollback: "Trưởng bộ phận vận hành CSKH có quyền dừng; tắt trợ lý trong tối đa 60 phút; nhân viên tiếp nhận các yêu cầu đang xử lý bằng quy trình thủ công; giữ trace và đối soát giao dịch đã phát sinh."
  decision_date: "2027-01-20 (đề xuất, chưa phải lịch đã xác nhận; chỉ đánh giá Go khi đủ cỡ mẫu và theo dõi đủ 7 ngày)."
  simulated_inputs: ["Dữ liệu yêu cầu và lần chạy của lab (simulated)", "baseline 0,70 (simulated)", "ICC 0,02 (simulated)", "alpha 0,05 (simulated)", "power mục tiêu 0,80 (simulated)", "MDE 0,06 (simulated)", "mức chi phí nhân viên 12.000 đồng (simulated)", "các số liệu chi phí từ cột _simulated", "các ngưỡng dừng, rollout và ngày đánh giá là đề xuất pilot"]
